<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Document title</title>
    <link rel='stylesheet' href='./style.css'></script>
    <script type="module" src="./index.js"></script>
  </head>
  <style>
#cy {
  width: 100%;
  height: 100%;
}
  </style>
  <body>
    <div class=container>
      <div id=left-panel>
        <div id=var-list-label>Var List</div>
        <div id='slider-container'>
          <input type='range' id='depth-slider' name='depth' value='1' min=0 max=10 step=1/>
          <label for="depth-slider">Depth: <output id='depth-value'> </output></label>
        </div>
        <div>
          <p> Focused Variable: <p id="focused-var-label"> </p> </p>
        </div>
        <div id='reset-focus-btn' class='btn'>
          Reset focus
        </div>
        <div id=var-list></div>
      </div>

      <div id=cy> </div>
    </div>
  </body>
</html>
